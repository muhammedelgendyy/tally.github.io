<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally</title>
<meta name="theme-color" content="#E8EDE9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tally">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* set theme before first paint */
try{var t=localStorage.getItem('tally.theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
<style>
:root{
  --bg:#E8EDE9; --surface:#F7F9F6; --ink:#13211E; --muted:#5A6B65; --line:#C9D4CD; --soft:#DCE4DE;
  --inc:#17795A; --exp:#B02452; --acc:#E9A31B; --acc-ink:#2A1D00;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1513; --surface:#15201D; --ink:#E6EEE9; --muted:#8FA19A; --line:#26362F; --soft:#1C2A26;
    --inc:#4CC79B; --exp:#F0708F; --acc:#F2B33D; --acc-ink:#241800; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1513; --surface:#15201D; --ink:#E6EEE9; --muted:#8FA19A; --line:#26362F; --soft:#1C2A26;
  --inc:#4CC79B; --exp:#F0708F; --acc:#F2B33D; --acc-ink:#241800; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:'Schibsted Grotesk','Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto}

/* ---------- top bar & tab bar ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{flex:none;position:relative;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 18px 8px}
.topbar h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 14px 32px}
.tabbar{flex:none;position:relative;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:58px}
.tab{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0 4px;font-size:11px;color:var(--muted);font-weight:500}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink);font-weight:650}
.tab.add{color:var(--acc-ink)}
.tab.add span.fab{width:54px;height:54px;border-radius:50%;background:var(--acc);display:grid;place-items:center;margin-top:-22px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.tab.add svg{width:28px;height:28px;stroke-width:2.4}

/* ---------- shared bits ---------- */
.amt{font-variant-numeric:tabular-nums;font-weight:650}
.cur{font-size:.68em;color:var(--muted);margin-left:.3em;font-weight:500}
.inc{color:var(--inc)} .exp{color:var(--exp)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.muted{color:var(--muted)}
.btn{font-weight:600;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--exp)}
.btn.block{display:block;width:100%;text-align:center}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.in{font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%;min-width:0}
.in:focus,.btn:focus-visible,.tab:focus-visible,.row:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.in.num{font-variant-numeric:tabular-nums;text-align:right}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.h2{font-size:17px;font-weight:700;margin:26px 0 8px;letter-spacing:-.01em}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll svg{display:block}
.axl{stroke:var(--line);stroke-width:1}
.axt{fill:var(--muted);font-size:9px}
.axv{fill:var(--muted);font-size:9px}

/* ---------- ledger ---------- */
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.monthnav b{font-size:18px}
.iconbtn{border:0;background:var(--soft);width:38px;height:38px;border-radius:50%;font-size:20px;line-height:1;color:var(--ink)}
.band{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 12px}
.band>div{padding:10px 8px;display:grid;gap:2px;min-width:0}
.band>div+div{border-left:1px solid var(--line)}
.band .bl{font-size:12px;color:var(--muted)}
.band b{font-size:17px;white-space:nowrap;display:grid;gap:0;line-height:1.15}
.band b .cur{margin-left:0;font-size:11px}
.controls{display:grid;gap:8px}
.controls .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 6px;font-size:13px;color:var(--muted);font-weight:600}
.dh .dt{color:var(--ink);white-space:nowrap;margin-right:10px}
.dh span:last-child{text-align:right}
.panel{background:var(--surface);border-radius:12px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;text-align:start}
.row+.row,.row+.receipt,.receipt+.row{border-top:1px solid var(--line)}
.rmain{flex:1;min-width:0;display:grid;gap:1px}
.rt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{font-size:13px;color:var(--muted)}
.ramt{text-align:right;display:grid;justify-items:end;white-space:nowrap}
.a1{display:inline-flex;align-items:baseline}
.ramt small{font-size:12px;color:var(--muted)}

/* the receipt tree (detailed view) */
.receipt{position:relative;background:var(--surface);padding:12px 14px 16px;cursor:pointer;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 7px) no-repeat,conic-gradient(from -45deg at 50% 100%,#000 90deg,#0000 0) bottom/14px 7px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 7px) no-repeat,conic-gradient(from -45deg at 50% 100%,#000 90deg,#0000 0) bottom/14px 7px repeat-x}
.panel .receipt{margin-bottom:0}
.rhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:6px;border-bottom:1.5px dashed var(--line)}
.rhead .rt{font-size:16px}
.tree{margin:8px 0 0 6px}
.li{position:relative;display:flex;align-items:baseline;gap:8px;padding:6px 0 6px 20px}
.li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--line)}
.li:last-child::before{bottom:50%}
.li::after{content:"";position:absolute;left:0;top:50%;width:13px;border-top:1.5px solid var(--line)}
.li .ln{display:grid;min-width:0}
.li .ln span{overflow:hidden;text-overflow:ellipsis}
.li .ln small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.li .ln small .dot{width:7px;height:7px}
.li .lead{flex:1;border-bottom:1.5px dotted var(--line);min-width:12px;transform:translateY(-4px)}
.li .la{white-space:nowrap}
.li.rest .ln span{color:var(--muted);font-style:italic}

/* ---------- dashboard ---------- */
.rank{display:grid;gap:10px}
.rank .r{display:grid;gap:4px}
.rank .r .top{display:flex;align-items:center;gap:8px}
.rank .r .top .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .r .bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.rank .r .bar i{display:block;height:100%;border-radius:3px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin:4px 0 6px}
.legend span{display:flex;align-items:center;gap:6px}

/* ---------- convert & settings ---------- */
.convert-out{display:grid;gap:0;margin-top:14px}
.convert-out .cr{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px;border-top:1px solid var(--line)}
.convert-out .cr b{font-size:26px;font-variant-numeric:tabular-nums}
.convert-out .cr span{color:var(--muted);font-weight:600}
.set-sec{margin:24px 0 0}
.set-sec>h3{font-size:13px;margin:0 4px 6px;color:var(--muted);font-weight:600}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface);border:0;width:100%;text-align:start}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .in{width:130px}
.badge{font-size:11px;background:var(--acc);color:var(--acc-ink);border-radius:6px;padding:1px 6px;font-weight:700;margin-left:6px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}

/* ---------- auth ---------- */
#auth{position:fixed;inset:0;overflow-y:auto;display:flex;padding:calc(env(safe-area-inset-top) + 24px) 22px 40px}
#auth .box{max-width:380px;margin:auto;width:100%;display:grid;gap:12px}
#auth h1{font-size:40px;letter-spacing:-.03em;margin:0}
#auth p{margin:0;color:var(--muted)}
.err{color:var(--exp);font-size:14px;min-height:1.2em}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px;justify-self:center}

/* ---------- sheet (forms) ---------- */
#sheetHost{position:fixed;inset:0;z-index:20;display:none;background:rgba(6,12,10,.45)}
#sheetHost.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 10px);max-width:640px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-head{display:grid;grid-template-columns:80px 1fr 80px;align-items:center;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.sh-head b{text-align:center}
.sh-head button{background:none;border:0;font-weight:600;padding:6px}
.sh-head .save{text-align:right;color:var(--inc)}
.sh-head .cancel{text-align:left;color:var(--muted)}
.sh-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(env(safe-area-inset-bottom) + 40px);flex:1}
.fld{display:grid;gap:5px;margin:14px 0}
.fld>label,.lbl{font-size:13px;color:var(--muted);font-weight:600}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.irow{display:grid;grid-template-columns:1fr 96px;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.irow .sub{grid-column:1 / span 2;display:grid;grid-template-columns:1fr 40px;gap:6px}
.irow .x{border:0;background:var(--soft);border-radius:10px;font-size:20px}
.sumnote{font-size:13px;color:var(--muted);margin:8px 0}
.sumnote.bad{color:var(--exp)}
#busy{position:fixed;inset:0;z-index:40;background:rgba(6,12,10,.6);display:none;place-items:center}
#busy.open{display:grid}
#busy div{background:var(--surface);padding:22px 26px;border-radius:14px;font-weight:600;max-width:80%;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:1}

/* ---------- motion ---------- */
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes rowin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22) translateY(-2px)}100%{transform:scale(1)}}
@keyframes flash{0%{background:color-mix(in srgb,var(--acc) 45%,transparent)}100%{background:transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes down{to{transform:translateY(60px);opacity:.3}}
/* screen change: one orchestrated entrance */
#view.enter{animation:fadein .22s ease-out}
.enter .row,.enter .receipt{animation:rowin .38s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
.row.flash,.receipt.flash{animation:flash 1.6s ease-out}
.enter .rank .r{animation:rowin .4s cubic-bezier(.2,.7,.2,1) both}
.enter .rank .r:nth-child(2){animation-delay:.04s}.enter .rank .r:nth-child(3){animation-delay:.08s}
.enter .rank .r:nth-child(4){animation-delay:.12s}.enter .rank .r:nth-child(5){animation-delay:.16s}
.enter .rank .r:nth-child(n+6){animation-delay:.2s}
.enter .rank .bar i{transform-origin:left;animation:grow .7s cubic-bezier(.2,.7,.2,1) .1s both}
/* touch feedback */
.tab svg,.tab.add span.fab{transition:transform .15s}
.tab:active svg{transform:scale(.86)}
.tab.add:active .fab{transform:scale(.92)}
.tab.on svg{animation:pop .38s ease-out}
.btn,.row,.iconbtn,.set-row{transition:transform .12s,background-color .15s}
.btn:active,.iconbtn:active{transform:scale(.96)}
.row:active,.set-row:active{background:var(--soft)}
.seg button{transition:background-color .2s,color .2s,box-shadow .2s}
/* sheets, toast, busy */
#sheetHost.open{animation:fadein .2s ease-out}
#sheetHost.closing{animation:fadeout .2s ease-in forwards}
#sheetHost.closing .sheet{animation:down .2s ease-in forwards}
.sheet.noanim{animation:none}
.irow.in-new{animation:drop .3s cubic-bezier(.2,.7,.2,1)}
#toast{transform:translate(-50%,12px);transition:opacity .2s,transform .25s cubic-bezier(.2,.7,.2,1)}
#toast.show{transform:translate(-50%,0)}
#busy.open{animation:fadein .15s}
.spin{display:block;width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
/* gemini settings */
textarea.in{resize:none;display:block}
.keys{font-family:ui-monospace,Menlo,monospace;font-size:14px;-webkit-text-security:disc}
.keys.show{-webkit-text-security:none}
.kres{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);animation:drop .3s both}
.kres+.kres{border-top:1px solid var(--line)}
.kres em{font-style:normal;font-size:13px;font-weight:600;text-align:right}
.kres em.ok{color:var(--inc)}.kres em.no{color:var(--exp)}.kres em.wait{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:8px 4px 0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
/* ---------- dashboard widgets ---------- */
body.wide .wrap{max-width:1080px}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--ink);transition:background-color .2s,color .2s,border-color .2s,transform .12s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dtools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 2px 0}
.rangeline{font-size:13px;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:1fr;gap:0 32px}
@media (min-width:900px){.dgrid{grid-template-columns:1fr 1fr}.dgrid .w-summary,.dgrid .w-line,.dgrid .w-days{grid-column:1/-1}}
.w{min-width:0}
.wh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 0 10px}
.wh h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.w-summary .band{margin-top:14px}
.hintline{font-size:13px;margin-top:6px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
/* tap a number to enlarge it */
.band>div.pop{cursor:pointer;-webkit-user-select:none;user-select:none}
.band .pop b{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.band .pop.popped{position:relative;z-index:41}
.band .pop.popped b{transform:scale(1.5);transform-origin:left center}
.band .pop:last-child.popped b{transform-origin:right center}
.band .pop:nth-child(2).popped b{transform-origin:center}
#popBackdrop{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
#popBackdrop.on{opacity:1;pointer-events:auto}
/* area chart */
.lc-svg{width:100%;height:auto;display:block;touch-action:pan-y;cursor:crosshair}
.lc-svg .ln{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1}
.lc-svg .ln.i{stroke:var(--inc)}.lc-svg .ln.e{stroke:var(--exp)}
.lc-svg .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.lc-svg .gl{fill:var(--muted);font-size:11px}
.lc-svg .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}
.enter .lc-svg .ln{animation:draw 1.1s cubic-bezier(.2,.7,.2,1) .15s both}
.enter .lc-svg .ar{animation:fadein .9s ease-out .35s both}
.enter .lc-svg .pt{animation:fadein .3s ease-out .9s both}
.lc-card{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.7,.2,1)}
.lc-card.open{grid-template-rows:1fr}
.lc-in{overflow:hidden;min-height:0}
.lc-box{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 14px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.lc-date{font-weight:700}
.lc-rows{display:flex;gap:6px 16px;flex-wrap:wrap}
.lc-rows span{display:flex;align-items:center;gap:6px;font-size:14px}
/* doughnut */
.dn{display:grid;justify-items:center;gap:12px}
.dn svg{width:min(100%,290px);height:auto;display:block;overflow:visible}
.dn .sl{cursor:pointer;stroke:var(--bg);stroke-width:2;stroke-linejoin:round;transition:opacity .2s}
.dn .ct{text-anchor:middle;pointer-events:none}
.dn-card{width:100%;min-height:54px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;visibility:hidden}
.dn-card.on{opacity:1;transform:none;visibility:visible}
.dn-card .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px}
.lg{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:0;background:var(--soft);font-size:13px;color:var(--muted);transition:background-color .2s,color .2s,transform .12s}
.lg:active{transform:scale(.95)}
.lg.on{background:var(--ink);color:var(--bg)}
/* top spending */
.tabs2{margin-bottom:14px}
.backrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.rank button.r{background:none;border:0;text-align:start;padding:0;width:100%;color:inherit}
.rank button.r:active .bar i{opacity:.7}
/* day cards */
.dc-track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.dc-track::-webkit-scrollbar{display:none}
.dc-card{flex:none;width:152px;scroll-snap-align:start;text-align:start;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;gap:8px;align-content:start;transition:transform .15s}
.dc-card:active{transform:scale(.97)}
.dc-d{display:grid}.dc-d b{font-size:16px}.dc-d span{font-size:12px;color:var(--muted)}
.dc-r{display:flex;justify-content:space-between;gap:6px;font-size:13px}
.dc-net{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.dc-go{font-size:12px;color:var(--muted)}
.enter .dc-card{animation:rowin .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
/* widget manager */
.wbtns{display:flex;gap:6px;align-items:center}
.iconbtn[disabled]{opacity:.3}
.rawbox{padding:10px 12px;border-radius:10px;background:var(--soft);font-size:14px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:#13211E;display:grid;place-content:center;justify-items:center;gap:16px;transition:opacity .45s,visibility .45s}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
#splash .sp-in{position:relative;width:96px;height:96px;display:grid;place-items:center}
#splash img{width:72px;height:72px;border-radius:18px;position:relative}
#splash .sp-ring{position:absolute;inset:0;border-radius:50%;border:2.5px solid transparent;border-top-color:#E9A31B;border-right-color:rgba(233,163,27,.3);animation:spin .9s linear infinite}
#splash p{margin:0;color:#E6EEE9;font-weight:700;letter-spacing:.4px;animation:fadein .6s both}

.tb{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lc-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.seg.mini{width:auto}.seg.mini button{flex:none;padding:5px 12px;font-size:13px}
.dn-card{display:grid;gap:8px;align-content:center;min-height:82px}
.dn-r1{display:flex;align-items:center;gap:10px}
.dn-r1 .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-r2{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.dn-r2 .btn{color:var(--ink)}
</style>
</head>
<body>

<div id="splash"><div class="sp-in"><i class="sp-ring"></i><img src="icons/icon-192.png" alt=""></div><p>Tally</p></div>

<div id="auth" hidden></div>

<div id="app" hidden>
  <div id="popBackdrop"></div>
  <header class="topbar"><div class="wrap tb"><h1 id="pageTitle">Ledger</h1><div id="topAct"></div></div></header>
  <main><div class="wrap" id="view"></div></main>
  <div class="tabbar"><nav aria-label="Main">
    <button class="tab" data-tab="ledger"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 10h14M5 15h9M5 20h6"/></svg>Ledger</button>
    <button class="tab" data-tab="dash"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Dashboard</button>
    <button class="tab add" data-act="new" aria-label="Add transaction"><span class="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <button class="tab" data-tab="convert"><svg viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>Convert</button>
    <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
  </nav></div>
</div>

<div id="sheetHost"></div>
<div id="busy"><div><i class="spin"></i><span id="busyText">Working…</span></div></div>
<div id="toast" role="status"></div>

<script>
'use strict';
/* =====================================================================
   Tally: personal expense & income tracker
   Data lives only on this device, encrypted with your password.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const round2=n=>Math.round(n*100)/100;

// <parse>
const pad=n=>String(n).padStart(2,'0');
function normDigits(s){
  return String(s||'')
    .replace(/[\u0660-\u0669]/g,d=>'\u0660\u0661\u0662\u0663\u0664\u0665\u0666\u0667\u0668\u0669'.indexOf(d))
    .replace(/[\u06F0-\u06F9]/g,d=>'\u06F0\u06F1\u06F2\u06F3\u06F4\u06F5\u06F6\u06F7\u06F8\u06F9'.indexOf(d))
    .replace(/\u066B/g,'.').replace(/\u066C/g,',');
}
function parseAmt(v){
  let s=normDigits(String(v??'')).trim();
  if(!s) return NaN;
  s=s.replace(/[^\d.,-]/g,'');
  if(/^-?\d+,\d{1,2}$/.test(s)) s=s.replace(',','.'); else s=s.replace(/,/g,'');
  const n=parseFloat(s);
  return isFinite(n)?n:NaN;
}
function findDate(text){
  let m=text.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/),y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3];}
  else{
    m=text.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(!m) return '';
    d=+m[1];mo=+m[2];y=+m[3];
    if(y<100) y+=2000;
    if(mo>12&&d<=12){const t=d;d=mo;mo=t;}
  }
  if(mo<1||mo>12||d<1||d>31||y<2000||y>2100) return '';
  return y+'-'+pad(mo)+'-'+pad(d);
}
function parseReceipt(raw){
  const text=normDigits(raw||'');
  const lines=text.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const NUM=/\d{1,6}[.,]\d{2}(?!\d)/g;
  const SKIP=/(sub\s*-?\s*total|total|vat|tax|trn|change|cash|card|visa|master|balance|tender|rounding|discount|saving|points|invoice|receipt|tel\b|phone|www\.|thank|item\s*count|qty|quantity|\u0627\u0644\u0645\u062C\u0645\u0648\u0639|\u0627\u062C\u0645\u0627\u0644\u064A|\u0625\u062C\u0645\u0627\u0644\u064A|\u0627\u0644\u0627\u062C\u0645\u0627\u0644\u064A|\u0636\u0631\u064A\u0628\u0629|\u0627\u0644\u0636\u0631\u064A\u0628\u0629|\u0646\u0642\u062F|\u0628\u0637\u0627\u0642\u0629|\u0627\u0644\u0628\u0627\u0642\u064A|\u062E\u0635\u0645|\u0641\u0627\u062A\u0648\u0631\u0629|\u0634\u0643\u0631\u0627|\u0647\u0627\u062A\u0641|\u0631\u0642\u0645)/i;
  const TOTAL=/(grand\s*total|total\s*due|amount\s*due|net\s*total|net\s*amount|\btotal\b|\u0627\u0644\u0627\u062C\u0645\u0627\u0644\u064A|\u0627\u062C\u0645\u0627\u0644\u064A|\u0625\u062C\u0645\u0627\u0644\u064A|\u0627\u0644\u0645\u062C\u0645\u0648\u0639|\u0627\u0644\u0645\u0628\u0644\u063A)/i;
  const NOTTOTAL=/(sub|vat|tax|\u0636\u0631\u064A\u0628\u0629|\u0627\u0644\u0636\u0631\u064A\u0628\u0629|items?|qty)/i;
  let title='';
  for(const l of lines){
    const letters=(l.match(/[A-Za-z\u0600-\u06FF]/g)||[]).length;
    const digits=(l.match(/\d/g)||[]).length;
    if(letters>=3&&digits<letters&&l.length<=60&&!SKIP.test(l)){title=l;break;}
  }
  const items=[],totals=[];
  for(const l of lines){
    const nums=[...l.matchAll(NUM)];
    if(!nums.length) continue;
    const val=parseAmt(nums[nums.length-1][0]);
    if(TOTAL.test(l)&&!NOTTOTAL.test(l)){totals.push(val);continue;}
    if(SKIP.test(l)) continue;
    let name=l.replace(NUM,' ').replace(/\b(AED|EGP|USD|LE|DHS?)\b/gi,' ').replace(/\b\d{5,}\b/g,' ')
      .replace(/[|*#=_~]+/g,' ').replace(/^\s*\d+\s*[xX*]\s*/,'').replace(/\s+/g,' ').trim();
    name=name.replace(/^[\d\s.,-]+|[\d\s.,-]+$/g,'').trim();
    if(!/[A-Za-z\u0600-\u06FF]{2,}/.test(name)||!(val>0)) continue;
    items.push({name:name.slice(0,60),amount:val});
  }
  const sum=items.reduce((s,i)=>s+i.amount,0);
  const total=totals.length?Math.max(...totals):(items.length?round2(sum):null);
  const curs=[...new Set((text.match(/\b(AED|EGP|USD)\b/gi)||[]).map(c=>c.toUpperCase()))];
  return {title,date:findDate(text),total,items,currency:curs.length===1?curs[0]:''};
}
// </parse>

/* ---------- dates & money ---------- */
const APP_VER='4';
const CURS=['AED','EGP','USD'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3=MONTHS.map(m=>m.slice(0,3));
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const nowYm=()=>todayStr().slice(0,7);
const ymLabel=ym=>{const [y,m]=ym.split('-').map(Number);return MONTHS[m-1]+' '+y;};
const shiftMonth=(ym,d)=>{const [y,m]=ym.split('-').map(Number);const dt=new Date(y,m-1+d,1);return dt.getFullYear()+'-'+pad(dt.getMonth()+1);};
const monthsBack=(end,n)=>Array.from({length:n},(_,i)=>shiftMonth(end,-(n-1-i)));
function dayLabel(s){
  const [y,m,d]=s.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const t=s===todayStr()?'Today, ':'';
  return t+DAYS[dt.getDay()]+' '+d+' '+MON3[m-1];
}
const nf=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=(n,c)=>`<span class="amt">${nf.format(n)}</span><span class="cur">${c}</span>`;
const short=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':String(Math.round(n));

/* ---------- crypto & storage ---------- */
const VAULT='tally.vault';
const enc=new TextEncoder(),dec=new TextDecoder();
const toB64=buf=>{const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(password,salt){
  const base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptJSON(k,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));
  return {iv:toB64(iv),ct:toB64(ct)};
}
async function decryptJSON(k,v){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(v.iv)},k,fromB64(v.ct));
  return JSON.parse(dec.decode(pt));
}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('tally',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function kvGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function kvSet(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function kvDel(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
const loadVault=()=>{try{return JSON.parse(localStorage.getItem(VAULT));}catch{return null;}};

let key=null,state=null,vaultMeta=null,saving=Promise.resolve();
function save(){
  saving=saving.then(async()=>{
    const e=await encryptJSON(key,state);
    vaultMeta={...vaultMeta,...e};
    localStorage.setItem(VAULT,JSON.stringify(vaultMeta));
  }).catch(err=>{console.error(err);toast('Could not save. Device storage may be full.');});
  return saving;
}

/* ---------- default data ---------- */
const PALETTE=['#2F6F6A','#E9A31B','#B02452','#3C5FA8','#7B4FA0','#D9642B','#4E8F3A','#8C6D46','#C2427A','#2A8FA3','#6B7280','#A0522D'];
function defaultState(){
  const ex=[['groceries','Groceries'],['shopping','Shopping'],['transport','Transportation'],['dining','Food & dining'],['bills','Bills & utilities'],['health','Health'],['fun','Entertainment'],['travel','Travel'],['edu','Education'],['home','Home'],['other','Other']];
  const inc=[['salary','Salary'],['bonus','Bonus'],['freelance','Freelance'],['gift','Gift'],['otherinc','Other income']];
  const tags=[];
  ex.forEach(([id,name],i)=>tags.push({id,name,color:PALETTE[i%PALETTE.length],kind:'expense',builtin:true}));
  inc.forEach(([id,name],i)=>tags.push({id,name,color:['#17795A','#4E8F3A','#2A8FA3','#C2427A','#6B7280'][i],kind:'income',builtin:true}));
  return {v:1,settings:{base:'AED',rates:{USD:1,AED:3.6725,EGP:50},manual:{},ratesAt:0},tags,tx:[],rules:{}};
}

/* ---------- helpers on state ---------- */
const base=()=>state.settings.base;
const tagOf=id=>state.tags.find(t=>t.id===id)||{id:'',name:'Untagged',color:'#6B7280',kind:'expense'};
const conv=(amt,from,to,fx)=>{fx=fx||state.settings.rates;return amt/fx[from]*fx[to];};
const inBase=(t,amt)=>conv(amt,t.currency,base(),t.fx);
function allocations(t){
  if(t.items&&t.items.length){
    const a=t.items.map(i=>({tagId:i.tagId,name:i.name,amount:i.amount}));
    const rest=round2(t.total-t.items.reduce((s,i)=>s+i.amount,0));
    if(rest>0.005) a.push({tagId:t.tagId,name:'Not itemized',amount:rest,rest:true});
    return a;
  }
  return [{tagId:t.tagId,name:t.title,amount:t.total}];
}
function sumMonth(ym,type){return state.tx.filter(t=>t.type===type&&t.date.startsWith(ym)).reduce((s,t)=>s+inBase(t,t.total),0);}

/* ---------- UI state ---------- */
const ui={tab:'ledger',month:nowYm(),view:'overall',q:'',tag:'',lRange:null,lineMode:'both',period:'month',dMonth:nowYm(),dYear:new Date().getFullYear(),dFrom:'',dTo:'',topTab:'merchant',topDrill:null,cvAmt:'100',cvFrom:'AED'};
let form=null;

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),Math.max(2600,String(msg).length*55));}
const showBusy=m=>{$('#busyText').textContent=m;$('#busy').classList.add('open');};
const hideBusy=()=>$('#busy').classList.remove('open');

/* ---------- theme ---------- */
function applyTheme(){
  const t=localStorage.getItem('tally.theme')||'system',r=document.documentElement;
  if(t==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);
  const dark=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
  $('meta[name=theme-color]').content=dark?'#0D1513':'#E8EDE9';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);

/* =====================================================================
   AUTH
   ===================================================================== */
function lockLeft(){return Math.max(0,(+localStorage.getItem('tally.lock')||0)-Date.now());}
function noteFail(){
  const f=(+localStorage.getItem('tally.fails')||0)+1;
  localStorage.setItem('tally.fails',f);
  if(f>=5)localStorage.setItem('tally.lock',Date.now()+Math.min(900,30*2**(f-5))*1000);
}
function importFormHTML(){
  return `<div class="fld"><label>Backup file</label><input class="in" type="file" id="impFile" accept=".json,application/json"></div>
  <div class="fld"><label>Password used for that backup</label><input class="in" type="password" id="impPass" autocomplete="current-password"></div>`;
}
function showAuth(mode){
  $('#app').hidden=true;
  const a=$('#auth');a.hidden=false;
  const has=!!loadVault();
  if(mode==='import'){
    a.innerHTML=`<div class="box"><h1>Import backup</h1><p>Restore your data from a backup file exported by Tally. It replaces what is stored on this device.</p>
    ${importFormHTML()}<div class="err" id="authErr"></div>
    <button class="btn pri block" data-act="doImport">Import</button>
    <button class="linkbtn" data-act="authBack">Back</button></div>`;
    return;
  }
  const setup=!has;
  a.innerHTML=`<div class="box"><h1>Tally</h1><p>${setup?'Create the account that unlocks your ledger. Your data stays on this device, encrypted with this password. There is no way to reset it, so keep a backup.':'Sign in to open your ledger.'}</p>
  <div class="fld"><label for="u">Username</label><input class="in" id="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
  <div class="fld"><label for="p">Password${setup?' (8+ characters)':''}</label><input class="in" id="p" type="password" autocomplete="${setup?'new-password':'current-password'}"></div>
  ${setup?`<div class="fld"><label for="p2">Repeat password</label><input class="in" id="p2" type="password" autocomplete="new-password"></div>`:''}
  <div class="err" id="authErr"></div>
  <button class="btn pri block" data-act="${setup?'doSetup':'doLogin'}">${setup?'Create account':'Sign in'}</button>
  <button class="linkbtn" data-act="authImport">Import a backup instead</button></div>`;
}
async function doSetup(){
  const u=$('#u').value.trim(),p=$('#p').value,p2=$('#p2').value,err=$('#authErr');
  if(!u){err.textContent='Choose a username.';return;}
  if(p.length<8){err.textContent='Use at least 8 characters for the password.';return;}
  if(p!==p2){err.textContent='The two passwords do not match.';return;}
  err.textContent='';showBusy('Creating your vault…');
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));
    key=await deriveKey(p,salt);
    state=defaultState();
    vaultMeta={v:1,username:u,salt:toB64(salt)};
    await save();
    try{await kvSet('session',key);}catch{}
    startApp();refreshRates(true);
  }catch(e){err.textContent='Could not create the vault: '+e.message;}
  finally{hideBusy();}
}
async function doLogin(){
  const err=$('#authErr'),left=lockLeft();
  if(left>0){err.textContent=`Too many attempts. Try again in ${Math.ceil(left/1000)} seconds.`;return;}
  const u=$('#u').value.trim(),p=$('#p').value,v=loadVault();
  if(!v||!u||!p){err.textContent='Enter your username and password.';return;}
  showBusy('Unlocking…');
  try{
    const k=await deriveKey(p,fromB64(v.salt));
    let st=null;
    if(u.toLowerCase()===String(v.username).toLowerCase()){try{st=await decryptJSON(k,v);}catch{}}
    if(!st){noteFail();err.textContent='Wrong username or password.';return;}
    localStorage.removeItem('tally.fails');localStorage.removeItem('tally.lock');
    key=k;state=st;vaultMeta=v;
    try{await kvSet('session',key);}catch{}
    startApp();
  }finally{hideBusy();}
}
async function doImport(){
  const err=$('#authErr')||$('#impErr');
  const f=$('#impFile').files[0],p=$('#impPass').value;
  if(!f||!p){err.textContent='Choose the backup file and enter its password.';return;}
  showBusy('Importing…');
  try{
    const v=JSON.parse(await f.text());
    if(!(v&&v.v===1&&v.salt&&v.iv&&v.ct&&v.username))throw new Error('This file is not a Tally backup.');
    const k=await deriveKey(p,fromB64(v.salt));
    let st;try{st=await decryptJSON(k,v);}catch{throw new Error('Wrong password for this backup.');}
    localStorage.setItem(VAULT,JSON.stringify(v));
    key=k;state=st;vaultMeta=v;
    try{await kvSet('session',key);}catch{}
    closeSheet();startApp();toast('Backup imported');
  }catch(e){err.textContent=e.message;}
  finally{hideBusy();}
}
async function logout(){
  try{await kvDel('session');}catch{}
  key=null;state=null;closeSheet();showAuth('login');
}

/* =====================================================================
   RATES
   ===================================================================== */
async function refreshRates(force){
  const s=state.settings;
  if(!force&&Date.now()-s.ratesAt<12*3600*1000)return false;
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'});
    const j=await r.json();
    if(j.result!=='success')return false;
    CURS.forEach(c=>{if(c!=='USD'&&!s.manual[c]&&j.rates[c])s.rates[c]=j.rates[c];});
    s.ratesAt=Date.now();
    await save();
    if(ui.tab==='convert'||ui.tab==='settings')render();
    return true;
  }catch{return false;}
}
const ago=ts=>{if(!ts)return 'never';const m=Math.round((Date.now()-ts)/60000);if(m<1)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<48)return h+' h ago';return Math.round(h/24)+' days ago';};

/* =====================================================================
   APP SHELL

function startApp(){
  $('#auth').hidden=true;$('#auth').innerHTML='';
  $('#app').hidden=false;
  state.settings.gemini=state.settings.gemini||{keys:[],model:'',last:null};
  state.rules=state.rules||{};
  render(true);
  hideSplash();
  refreshRates(false);
}
function hideSplash(){
  const s=$('#splash');if(!s)return;
  setTimeout(()=>{s.classList.add('hidden');setTimeout(()=>s.remove(),600);},Math.max(0,700-performance.now()));
}
function render(animate){
  const t=ui.tab;unpop();
  document.body.classList.toggle('wide',t==='dash');
  $('#topAct').innerHTML=t==='dash'?'<button class="btn sm" data-act="widgets">Widgets</button>':'';
  $('#pageTitle').textContent={ledger:'Ledger',dash:'Dashboard',convert:'Convert',settings:'Settings'}[t];
  $('#view').innerHTML=t==='ledger'?renderLedger():t==='dash'?renderDash():t==='convert'?renderConvert():renderSettings();
  $$('.tab[data-tab]').forEach(b=>{b.classList.toggle('on',b.dataset.tab===t);});
  if(t==='dash')initDash(!!animate);
  if(animate){const v=$('#view');v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');clearTimeout(render.t);render.t=setTimeout(()=>v.classList.remove('enter'),1500);if(t==='dash'||t==='ledger')countUps(v);}
}

/* ---------- sheet host ---------- */
function openSheet(html){
  const h=$('#sheetHost');clearTimeout(closeSheet.t);
  const was=h.classList.contains('open')&&!h.classList.contains('closing');
  h.classList.remove('closing');h.innerHTML=html;
  if(was){const s=$('.sheet',h);if(s)s.classList.add('noanim');}
  h.classList.add('open');document.body.style.overflow='hidden';
}
function closeSheet(){
  const h=$('#sheetHost');form=null;document.body.style.overflow='';
  if(!h.classList.contains('open'))return;
  h.classList.add('closing');clearTimeout(closeSheet.t);
  closeSheet.t=setTimeout(()=>{h.classList.remove('open','closing');h.innerHTML='';},200);
}
$('#sheetHost').addEventListener('click',e=>{if(e.target.id==='sheetHost'&&!form)closeSheet();});

function matchesFilter(t){
  const q=ui.q.trim().toLowerCase();
  if(ui.tag&&t.tagId!==ui.tag&&!(t.items||[]).some(i=>i.tagId===ui.tag))return false;
  if(q&&!(t.title.toLowerCase().includes(q)||(t.note||'').toLowerCase().includes(q)||(t.items||[]).some(i=>i.name.toLowerCase().includes(q))))return false;
  return true;
}
function renderLedger(){
  const tagOpts=`<option value="">All tags</option>`+state.tags.map(t=>`<option value="${t.id}" ${ui.tag===t.id?'selected':''}>${esc(t.name)}</option>`).join('');
  const R=ui.lRange;
  const nav=R?`<div class="monthnav"><button class="chip on" data-act="clearRange">${esc([ui.q?'\u201C'+ui.q+'\u201D':'',ui.tag?tagOf(ui.tag).name:'',R.label].filter(Boolean).join(', '))}  \u2715</button></div>`
    :`<div class="monthnav"><button class="iconbtn" data-act="prevM" aria-label="Previous month">\u2039</button><b>${ymLabel(ui.month)}</b><button class="iconbtn" data-act="nextM" aria-label="Next month">\u203A</button></div>`;
  return `${nav}
  <div class="controls">
    <div class="seg" role="group" aria-label="View"><button data-act="setView" data-v="overall" class="${ui.view==='overall'?'on':''}">Overall</button><button data-act="setView" data-v="detailed" class="${ui.view==='detailed'?'on':''}">Detailed</button></div>
    <div class="two"><input class="in" type="search" placeholder="Search" value="${esc(ui.q)}" data-filter="q" dir="auto"><select class="in" data-filter="tag">${tagOpts}</select></div>
  </div>
  <div id="ledgerBody">${ledgerBody()}</div>`;
}
let rowN=0;
function ledgerBody(){
  rowN=0;
  const R=ui.lRange;
  const list=state.tx.filter(t=>R?(t.date>=R.from&&t.date<=R.to):t.date.startsWith(ui.month)).filter(matchesFilter)
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
  const sp=list.filter(t=>t.type==='expense').reduce((s,t)=>s+inBase(t,t.total),0);
  const inc=list.filter(t=>t.type==='income').reduce((s,t)=>s+inBase(t,t.total),0);
  const net=inc-sp;
  let h=bandHTML(sp,inc);
  if(!list.length){
    return h+`<div class="empty">${ui.q||ui.tag?'Nothing matches this search in '+(R?R.label:ymLabel(ui.month))+'.':'Nothing recorded in '+(R?R.label:ymLabel(ui.month))+'.<br>Tap + to add an expense or income.'}</div>`;
  }
  const groups=new Map();
  list.forEach(t=>{if(!groups.has(t.date))groups.set(t.date,[]);groups.get(t.date).push(t);});
  for(const [d,txs] of groups){
    const ds=txs.filter(t=>t.type==='expense').reduce((s,t)=>s+inBase(t,t.total),0);
    const di=txs.filter(t=>t.type==='income').reduce((s,t)=>s+inBase(t,t.total),0);
    h+=`<div class="dh"><span class="dt">${dayLabel(d)}</span><span>${ds>0?'Spent '+nf.format(ds)+' '+base():''}${ds>0&&di>0?', ':''}${di>0?'In +'+nf.format(di)+' '+base():''}</span></div><div class="panel">${txs.map(rowHTML).join('')}</div>`;
  }
  return h;
}
function rowHTML(t){
  const tg=tagOf(t.tagId),n=(t.items||[]).length;
  if(ui.view==='detailed'&&t.type==='expense'&&n){
    const items=allocations(t);
    return `<div class="receipt${t.id===ui.flash?' flash':''}" style="--i:${Math.min(rowN++,14)}" data-act="edit" data-id="${t.id}" role="button" tabindex="0">
      <div class="rhead"><span class="rt" dir="auto">${esc(t.title)}</span><span class="ramt exp"><span class="a1">${money(t.total,t.currency)}</span></span></div>
      <div class="tree">${items.map(i=>{const g=tagOf(i.tagId);return `<div class="li${i.rest?' rest':''}"><span class="ln"><span dir="auto">${esc(i.name)}</span><small><i class="dot" style="background:${g.color}"></i>${esc(g.name)}</small></span><span class="lead"></span><span class="la">${money(i.amount,t.currency)}</span></div>`;}).join('')}</div>
    </div>`;
  }
  const sign=t.type==='income'?'+':'−';
  const sub=[tg.name,n?n+' items':''].filter(Boolean).join(', ');
  return `<button class="row${t.id===ui.flash?' flash':''}" style="--i:${Math.min(rowN++,14)}" data-act="edit" data-id="${t.id}"><i class="dot" style="background:${tg.color}"></i>
    <span class="rmain"><span class="rt" dir="auto">${esc(t.title)}</span><span class="rs">${esc(sub)}</span></span>
    <span class="ramt ${t.type==='income'?'inc':''}"><span class="a1">${sign}${money(t.total,t.currency)}</span>${t.currency!==base()?`<small>${nf.format(inBase(t,t.total))} ${base()}</small>`:''}</span></button>`;
}

const KEYWORDS=[
  ['groceries',['LULU','CARREFOUR','SPINNEYS','UNION COOP','CHOITHRAM','WAITROSE','BREADFAST','KAZYON','HYPERMARKET','SUPERMARKET','GROCER','سوبر ماركت','هايبر']],
  ['dining',['MCDONALD','KFC','STARBUCKS','BURGER KING','TALABAT','DELIVEROO','COSTA','TIM HORTONS','DUNKIN','PIZZA','HARDEE','SUBWAY','SHAKE SHACK','RESTAURANT','CAFE','COFFEE','DONUTS','ROSE PARIS','BAKERY','مطعم','كافيه','قهوة']],
  ['transport',['UBER','CAREEM','SALIK','ADNOC','ENOC','EPPCO','TAXI','DIDI','PARKING','DARB','NOL','مواصلات','بنزين']],
  ['bills',['ETISALAT','DEWA','ADDC','VODAFONE','ORANGE','TELECOM','ELECTRICITY','DU','WE','اتصالات','فودافون']],
  ['shopping',['AMAZON','NOON','SHEIN','IKEA','ZARA','H&M','NAMSHI','B TECH','KAMAL SAAD','MAX']],
  ['health',['PHARMACY','ASTER','NMC','CLINIC','HOSPITAL','BOOTS','DENTAL','صيدلية','مستشفى','عيادة']],
  ['fun',['NETFLIX','SPOTIFY','ANGHAMI','SHAHID','CINEMA','VOX','REEL','PLAYSTATION','STEAM']],
  ['travel',['EMIRATES','ETIHAD','AIR ARABIA','BOOKING.COM','HOTEL','NOVOTEL','AIRLINES','EGYPTAIR','AIRBNB']],
  ['edu',['SCHOOL','UNIVERSITY','COURSE','UDEMY','مدرسة','جامعة']],
  ['salary',['SALARY','PAYROLL','من جهة العمل','راتب']],
  ['bonus',['BONUS']]
];
const kwRe=new Map();
function kwMatch(u,w){
  if(w.length>3)return u.includes(w);
  let r=kwRe.get(w);
  if(!r){r=new RegExp('(^|[^A-Z0-9])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^A-Z0-9]|$)');kwRe.set(w,r);}
  return r.test(u);
}
function keywordTag(text){
  const u=String(text||'').toUpperCase();
  for(const [id,ws] of KEYWORDS)for(const w of ws)if(kwMatch(u,w))return id;
  return '';
}
const ruleKey=s=>String(s||'').trim().toUpperCase().replace(/\s+/g,' ');
function learnedTag(name){
  const k=ruleKey(name),id=k&&state.rules&&state.rules[k];
  return id&&state.tags.some(t=>t.id===id)?id:'';
}
function suggestTag(name,kind){
  const k=ruleKey(name);
  if(!k||k==='UNKNOWN')return '';
  const id=learnedTag(name)||keywordTag(name);
  const t=id&&state.tags.find(x=>x.id===id);
  return t&&(!kind||t.kind===kind)?id:'';
}
function learnRule(name,tagId){
  const k=ruleKey(name);
  if(!k||k==='UNKNOWN'||!tagId||tagId==='other'||tagId==='otherinc')return;
  const r=state.rules||(state.rules={});
  delete r[k];r[k]=tagId;
  const ks=Object.keys(r);
  if(ks.length>400)ks.slice(0,ks.length-400).forEach(x=>delete r[x]);
}

/* =====================================================================
   BANK SMS PARSER (ported from the Feloosy Feen project, extended to AED/USD)
   ===================================================================== */
// <sms>
function parseBankSMS(raw){
  const msg=normDigits(String(raw||'')).replace(/\s+/g,' ').trim();
  if(!msg)return null;
  if(/(تم رفض|rejected|insufficient|عدم كفاية|failed|declined)/i.test(msg))return {rejected:true};
  const CUR='(?:EGP|AED|USD|جم|ج\\.م|د\\.إ)';
  let amount=NaN;
  for(const re of [new RegExp(CUR+'\\s*([\\d,]+(?:\\.\\d{1,2})?)','i'),new RegExp('([\\d,]+\\.\\d{2})\\s*'+CUR,'i'),/(?:بمبلغ|بقيمة|مبلغ)\s*([\d,]+(?:\.\d{1,2})?)/]){
    const m=msg.match(re);
    if(m){const n=parseFloat(m[1].replace(/,/g,''));if(n>0){amount=n;break;}}
  }
  const low=msg.toLowerCase();
  let type='expense';
  if(low.includes('refunded')||msg.includes('تم إرجاع'))type='income';
  else if(msg.includes('إلى حسابك')||low.includes('to your account')||msg.includes('من جهة العمل'))type='income';
  else if(msg.includes('إيداع')||low.includes('deposit')||low.includes('credited'))type='income';
  let m,merchant='Unknown';
  if(m=msg.match(/at\s+(.+?)\s+on\s+\d{2}\/\d{2}\/\d{2}/i))merchant=m[1];
  else if(/تم سحب مبلغ\s+[\d,]+\.\d{2}/.test(msg))merchant='ATM withdrawal';
  else if(/تم إيداع مبلغ\s+[\d,]+\.\d{2}/.test(msg))merchant='ATM deposit';
  else if(m=msg.match(/من\s+(.+?)\s+برقم مرجعي/))merchant=m[1];
  else if(m=msg.match(/عند\s+(.+?)\s+في\s+\d{2}\/\d{2}\/\d{2}/))merchant=m[1];
  else if(m=msg.match(/from\s+(.+?)\s+(?:with|on)/i))merchant=m[1];
  else if(/من جهة العمل/.test(msg))merchant='Salary';
  else if(m=msg.match(/(?:at|@)\s+([A-Za-z0-9&'.\- ]{2,40}?)(?:\s+(?:on|with|using|for|ref)\b|[.,]|$)/i))merchant=m[1];
  merchant=merchant.replace(/\b(Pre|FBB|PF|STO|Br\s*I+|M\d+)\b/gi,'').replace(/\s+/g,' ').trim();
  if(merchant.includes('حسابك'))merchant=msg.includes('إلى حسابك')?'InstaPay in':'InstaPay out';
  if(msg.includes('تم إيداع مبلغ'))merchant='ATM deposit';
  if(msg.includes('تم سحب مبلغ'))merchant='ATM withdrawal';
  if(!merchant||merchant==='Unknown'){
    if(msg.includes('تحويل لحظي'))merchant=msg.includes('من حسابك')?'InstaPay out':'InstaPay in';
    else if(msg.includes('ATM')||msg.includes('بطاقة الخصم'))merchant='ATM withdrawal';
    else merchant='Unknown';
  }
  if(merchant.length<=2&&merchant!=='Unknown')merchant='Unknown person';
  const currency=/EGP|جم|ج\.م|جنيه/i.test(msg)?'EGP':/AED|د\.إ|درهم/i.test(msg)?'AED':/USD|\$|دولار/i.test(msg)?'USD':'';
  let tagId;
  if(type==='income')tagId=/salary|payroll|من جهة العمل|راتب/i.test(msg)?'salary':'otherinc';
  else tagId=suggestTag(merchant,'expense')||(keywordTag(msg)&&tagKindOf(keywordTag(msg))==='expense'?keywordTag(msg):'')||'other';
  return {amount,type,title:merchant,date:findDate(msg),currency,tagId,raw:String(raw).trim().slice(0,600)};
}
// </sms>
const tagKindOf=id=>{const t=state.tags.find(x=>x.id===id);return t&&t.kind;};

const WIDGETS={summary:'Summary',line:'Income vs spending',donut:'Where the money went',top:'Top spending',days:'Day cards'};
const PRESETS=[['today','Today'],['yesterday','Yesterday'],['7d','7 days'],['30d','30 days'],['month','Month'],['year','Year'],['all','All time'],['custom','Custom']];
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
let DASH=null;
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n));};
const lastDay=ym=>{const [y,m]=ym.split('-').map(Number);return ymd(new Date(y,m,0));};
const daysBetween=(a,b)=>{const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);};return Math.round((p(b)-p(a))/86400000);};
const fmtD=s=>{const [y,m,d]=s.split('-').map(Number);return d+' '+MON3[m-1]+' '+y;};
const sumBase=arr=>arr.reduce((s,t)=>s+inBase(t,t.total),0);
function tween(dur,fn){
  if(REDUCED||dur<=0){fn(1);return;}
  const t0=performance.now();
  const step=now=>{const p=Math.min(1,(now-t0)/dur);fn(1-Math.pow(1-p,3));if(p<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
function monotone(xs,ys){
  const n=xs.length;
  if(n<2)return `M${xs[0]},${ys[0]}`;
  const sg=v=>v<0?-1:1,t=new Array(n);
  for(let i=1;i<n-1;i++){
    const h0=xs[i]-xs[i-1],h1=xs[i+1]-xs[i],s0=(ys[i]-ys[i-1])/h0,s1=(ys[i+1]-ys[i])/h1,p=(s0*h1+s1*h0)/(h0+h1);
    t[i]=(sg(s0)+sg(s1))*Math.min(Math.abs(s0),Math.abs(s1),0.5*Math.abs(p))||0;
  }
  const s2=(x0,y0,x1,y1,tt)=>{const h=x1-x0;return h?(3*(y1-y0)/h-tt)/2:tt;};
  if(n===2){t[0]=t[1]=(ys[1]-ys[0])/(xs[1]-xs[0]);}
  else{t[0]=s2(xs[0],ys[0],xs[1],ys[1],t[1]);t[n-1]=s2(xs[n-1],ys[n-1],xs[n-2],ys[n-2],t[n-2]);}
  let d=`M${xs[0]},${ys[0]}`;
  for(let i=0;i<n-1;i++){const dx=(xs[i+1]-xs[i])/3;d+=` C${xs[i]+dx},${ys[i]+dx*t[i]} ${xs[i+1]-dx},${ys[i+1]-dx*t[i+1]} ${xs[i+1]},${ys[i+1]}`;}
  return d;
}
function arcPath(cx,cy,r0,r1,a0,a1){
  const pad=0.022;a0+=pad/2;a1-=pad/2;
  if(a1<=a0)return '';
  const p=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  if(a1-a0>=Math.PI*2-0.05){
    return `M${cx+r1},${cy} A${r1},${r1} 0 1 1 ${cx-r1},${cy} A${r1},${r1} 0 1 1 ${cx+r1},${cy}Z M${cx+r0},${cy} A${r0},${r0} 0 1 0 ${cx-r0},${cy} A${r0},${r0} 0 1 0 ${cx+r0},${cy}Z`;
  }
  const big=a1-a0>Math.PI?1:0,[x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
  return `M${x0},${y0} A${r1},${r1} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 ${big} 0 ${x3},${y3}Z`;
}

/* ---------- widget configuration ---------- */
function dashConf(){
  const s=state.settings,all=Object.keys(WIDGETS);
  const d=s.dash||(s.dash={order:[...all],hidden:[]});
  d.order=d.order.filter(x=>all.includes(x));
  all.forEach(k=>{if(!d.order.includes(k))d.order.push(k);});
  d.hidden=d.hidden.filter(x=>all.includes(x));
  return d;
}
function widgetsSheet(){
  const c=dashConf();
  openSheet(`<div class="sheet"><div class="sh-head"><span></span><b>Dashboard widgets</b><button class="save" data-act="closeSheet">Done</button></div><div class="sh-body">
    <p class="muted">Show, hide and reorder the widgets on your dashboard.</p>

}
function widgetAction(act,id){
  const c=dashConf(),i=c.order.indexOf(id);
  if(act==='wToggle'){const j=c.hidden.indexOf(id);if(j>=0)c.hidden.splice(j,1);else c.hidden.push(id);}
  if(act==='wUp'&&i>0)[c.order[i-1],c.order[i]]=[c.order[i],c.order[i-1]];
  if(act==='wDown'&&i<c.order.length-1)[c.order[i+1],c.order[i]]=[c.order[i],c.order[i+1]];
  save();widgetsSheet();render();
}

/* ---------- period ---------- */
function dashRange(){
  const t=todayStr(),p=ui.period;
  if(p==='today')return {from:t,to:t,label:'Today'};
  if(p==='yesterday'){const y=addDays(t,-1);return {from:y,to:y,label:'Yesterday'};}
  if(p==='7d')return {from:addDays(t,-6),to:t,label:'Last 7 days'};
  if(p==='30d')return {from:addDays(t,-29),to:t,label:'Last 30 days'};
  if(p==='month')return {from:ui.dMonth+'-01',to:lastDay(ui.dMonth),label:ymLabel(ui.dMonth)};
  if(p==='year')return {from:ui.dYear+'-01-01',to:ui.dYear+'-12-31',label:String(ui.dYear)};
  if(p==='custom'){const a=ui.dFrom||t,b=ui.dTo||t;return a<=b?{from:a,to:b,label:'Custom'}:{from:b,to:a,label:'Custom'};}
  const ds=state.tx.map(x=>x.date).sort();
  return {from:ds[0]||t,to:ds[ds.length-1]||t,label:'All time'};
}
function makeBuckets(R,P){
  const span=daysBetween(R.from,R.to)+1,daily=span<=62,map=new Map();
  if(daily){for(let i=0;i<span;i++){const d=addDays(R.from,i);map.set(d,{key:d,inc:0,exp:0,n:0});}}
  else{let ym=R.from.slice(0,7);const end=R.to.slice(0,7);while(ym<=end){map.set(ym,{key:ym,inc:0,exp:0,n:0});ym=shiftMonth(ym,1);}}
  P.forEach(t=>{const b=map.get(daily?t.date:t.date.slice(0,7));if(!b)return;const v=inBase(t,t.total);if(t.type==='income')b.inc+=v;else b.exp+=v;b.n++;});
  let list=[...map.values()];
  if(!daily&&list.length>36)list=list.slice(-36);
  return {daily,list};
}
const bShort=(b,daily)=>daily?(+b.key.slice(8,10))+' '+MON3[+b.key.slice(5,7)-1]:MON3[+b.key.slice(5,7)-1]+' '+b.key.slice(2,4);
const bLong=(b,daily)=>daily?dayLabel(b.key):ymLabel(b.key);
const bRange=(b,daily)=>daily?{from:b.key,to:b.key,label:dayLabel(b.key)}:{from:b.key+'-01',to:lastDay(b.key),label:ymLabel(b.key)};
function tagRows(ex){
  const m=new Map();
  ex.forEach(t=>allocations(t).forEach(a=>{m.set(a.tagId,(m.get(a.tagId)||0)+inBase(t,a.amount));}));
  return [...m.entries()].map(([id,v])=>({id,name:tagOf(id).name,color:tagOf(id).color,v})).sort((a,b)=>b.v-a.v);
}

/* ---------- summary numbers: count-up and tap-to-enlarge ---------- */
function bandHTML(sp,ic){
  const net=ic-sp;
  const cell=(l,v,cls)=>`<div class="pop" data-act="pop"><span class="bl">${l}</span><b class="${cls}"><span class="amt" data-count="${round2(v)}">${nf.format(v)}</span><span class="cur">${base()}</span></b></div>`;
  return `<div class="band">${cell('Spent',sp,'exp')}${cell('Income',ic,'inc')}${cell('Net',net,net>=0?'inc':'exp')}</div>`;
}
function countUps(root){
  if(REDUCED)return;
  $$('[data-count]',root).forEach(el=>{
    const to=+el.dataset.count,t0=performance.now();
    const step=now=>{const p=Math.min(1,(now-t0)/650),e=1-Math.pow(1-p,3);el.textContent=nf.format(to*e);if(p<1)requestAnimationFrame(step);};
    el.textContent=nf.format(0);requestAnimationFrame(step);
  });
}
function unpop(){
  $$('.popped').forEach(c=>{clearTimeout(c._t);c.classList.remove('popped');});
  const b=$('#popBackdrop');if(b)b.classList.remove('on');
}
function popToggle(cell){
  const was=cell.classList.contains('popped');
  unpop();
  if(was)return;
  cell.classList.add('popped');$('#popBackdrop').classList.add('on');
  cell._t=setTimeout(unpop,3000);
}

/* ---------- dashboard shell ---------- */
function dashHead(R){
  const p=ui.period;
  let h=`<div class="chips" id="chips">${PRESETS.map(([k,l])=>`<button class="chip${p===k?' on':''}" data-act="setPeriod" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(p==='month')h+=`<div class="monthnav"><button class="iconbtn" data-act="dPrev" aria-label="Previous month">‹</button><b>${ymLabel(ui.dMonth)}</b><button class="iconbtn" data-act="dNext" aria-label="Next month">›</button></div>`;
  else if(p==='year')h+=`<div class="monthnav"><button class="iconbtn" data-act="dPrev" aria-label="Previous year">‹</button><b>${ui.dYear}</b><button class="iconbtn" data-act="dNext" aria-label="Next year">›</button></div>`;
  else if(p==='custom')h+=`<div class="two-col" style="margin:8px 0 4px"><div class="fld" style="margin:0"><label for="dFrom">From</label><input class="in" type="date" id="dFrom" data-dcustom="dFrom" value="${R.from}"></div><div class="fld" style="margin:0"><label for="dTo">To</label><input class="in" type="date" id="dTo" data-dcustom="dTo" value="${R.to}"></div></div>`;
  const rt=(p==='month'||p==='year'||p==='custom')?'':(R.from===R.to?fmtD(R.from):fmtD(R.from)+' to '+fmtD(R.to));
  return h+(rt?`<div class="dtools"><span class="rangeline">${rt}</span></div>`:'');
}
function renderDash(){
  const conf=dashConf(),R=dashRange();
  const P=state.tx.filter(t=>t.date>=R.from&&t.date<=R.to);
  const ex=P.filter(t=>t.type==='expense'),inc=P.filter(t=>t.type==='income');
  DASH={R,P,ex,inc,sp:sumBase(ex),ic:sumBase(inc),B:makeBuckets(R,P),rows:tagRows(ex),sel:null};
  const head=dashHead(R);
  if(!P.length)return head+`<div class="empty">No transactions in this period yet.</div>`;
  const W={summary:wSummary,line:wLine,donut:wDonut,top:wTop,days:wDays};
  const ids=conf.order.filter(id=>!conf.hidden.includes(id));
  return head+(ids.length?`<div class="dgrid">${ids.map(id=>W[id]()).join('')}</div>`:`<div class="empty">All widgets are hidden. Tap Widgets to bring some back.</div>`);
}
function initDash(animate){
  const c=$('#chips'),on=c&&$('.chip.on',c);
  if(on)c.scrollLeft=on.offsetLeft-c.clientWidth/2+on.clientWidth/2;
  if(!DASH||!DASH.P.length)return;
  initDonut(animate);bindLine();
}
function goLedger(o){
  ui.lRange=o.range||null;ui.q=o.q||'';ui.tag=o.tag||'';ui.tab='ledger';
  if(o.range)ui.month=o.range.from.slice(0,7);
  render(true);$('main').scrollTop=0;
}

/* ---------- widget: summary ---------- */
function wSummary(){return `<section class="w w-summary">${bandHTML(DASH.sp,DASH.ic)}</section>`;}

/* ---------- widget: income vs spending area chart ---------- */
function wLine(){
  const {list,daily}=DASH.B;
  const both=ui.lineMode!=='spend';
  const head=`<div class="wh"><h2>Income vs spending</h2></div><div class="lc-tools"><div class="legend">${both?'<span><i class="dot" style="background:var(--inc)"></i>Income</span>':''}<span><i class="dot" style="background:var(--exp)"></i>Spending</span></div><div class="seg mini" role="group" aria-label="Series"><button data-act="lineMode" data-v="both" class="${both?'on':''}">Both</button><button data-act="lineMode" data-v="spend" class="${both?'':'on'}">Spending only</button></div></div>`;
  if(list.length<2)return `<section class="w w-line">${head}<div class="muted">Choose a longer period to see the trend.</div></section>`;
  const cw=($('#view')&&$('#view').clientWidth)||600,W=Math.max(300,Math.min(1080,cw)),H=W>700?290:220,pl=40,pr=12,pt=12,pb=28,n=list.length,b0=H-pb;
  const max=Math.max(1,...list.map(b=>both?Math.max(b.inc,b.exp):b.exp))*1.12;
  const px=i=>pl+i*(W-pl-pr)/(n-1),py=v=>b0-(v/max)*(b0-pt);
  const xs=list.map((_,i)=>px(i)),yi=list.map(b=>py(b.inc)),ye=list.map(b=>py(b.exp));
  DASH.line={xs,yi,ye,W,both};
  const area=ys=>monotone(xs,ys)+` L${xs[n-1]},${b0} L${xs[0]},${b0}Z`;
  let s=`<svg id="lcSvg" class="lc-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and spending over time"><defs>
    <linearGradient id="gInc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--inc);stop-opacity:.34"/><stop offset="1" style="stop-color:var(--inc);stop-opacity:.02"/></linearGradient>
    <linearGradient id="gExp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--exp);stop-opacity:.34"/><stop offset="1" style="stop-color:var(--exp);stop-opacity:.02"/></linearGradient></defs>`;
  for(let g=0;g<=3;g++){const y=py(max*g/3);s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="gl" x="${pl-6}" y="${y+3}" text-anchor="end">${short(max*g/3)}</text>`;}
  if(both)s+=`<path class="ar" d="${area(yi)}" fill="url(#gInc)"/>`;
  s+=`<path class="ar" d="${area(ye)}" fill="url(#gExp)"/>`;
  if(both)s+=`<path class="ln i" pathLength="1" d="${monotone(xs,yi)}"/>`;
  s+=`<path class="ln e" pathLength="1" d="${monotone(xs,ye)}"/>`;
  if(n<=16)list.forEach((b,i)=>{s+=(both?`<circle class="pt" cx="${xs[i]}" cy="${yi[i]}" r="3.5" fill="var(--inc)"/>`:'')+`<circle class="pt" cx="${xs[i]}" cy="${ye[i]}" r="3.5" fill="var(--exp)"/>`;});
  const k=Math.min(n,6);
  for(let j=0;j<k;j++){const i=k===1?0:Math.round(j*(n-1)/(k-1));s+=`<text class="gl" x="${xs[i]}" y="${H-8}" text-anchor="${j===0?'start':j===k-1?'end':'middle'}">${bShort(list[i],daily)}</text>`;}
  s+=`<line id="lcCross" class="cross" y1="${pt}" y2="${b0}" x1="0" x2="0" opacity="0"/><circle id="lcDi" r="6" fill="var(--inc)" stroke="var(--bg)" stroke-width="2" opacity="0"/><circle id="lcDe" r="6" fill="var(--exp)" stroke="var(--bg)" stroke-width="2" opacity="0"/><rect id="lcHit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg>`;
  const card=`<div class="lc-card" id="lcCard"><div class="lc-in"><div class="lc-box"><div class="lc-date" id="lcDate"></div><div class="lc-rows" id="lcRows"></div><button class="btn sm" data-act="lcView">View transactions</button></div></div></div>`;
  return `<section class="w w-line">${head}${s}${card}<div class="muted hintline">Tap or drag on the chart to inspect a ${daily?'day':'month'}.</div></section>`;
}
function lcSelect(i){
  const D=DASH,L=D.line,b=D.B.list[i];
  if(!L||!b)return;
  D.sel=i;
  const c=$('#lcCross');c.setAttribute('x1',L.xs[i]);c.setAttribute('x2',L.xs[i]);c.setAttribute('opacity','.7');
  const di=$('#lcDi'),de=$('#lcDe');
  di.setAttribute('cx',L.xs[i]);di.setAttribute('cy',L.yi[i]);de.setAttribute('cx',L.xs[i]);de.setAttribute('cy',L.ye[i]);
  di.setAttribute('opacity',L.both?'1':'0');de.setAttribute('opacity','1');
  const net=b.inc-b.exp;
  $('#lcDate').textContent=bLong(b,D.B.daily)+', '+base();
  $('#lcRows').innerHTML=`<span><i class="dot" style="background:var(--inc)"></i>Income <b class="amt">${nf.format(b.inc)}</b></span><span><i class="dot" style="background:var(--exp)"></i>Spent <b class="amt">${nf.format(b.exp)}</b></span><span>Net <b class="amt ${net>=0?'inc':'exp'}">${nf.format(net)}</b></span>`;
  $('#lcCard').classList.add('open');
}
function bindLine(){
  const svg=$('#lcSvg');
  if(!svg||!DASH||!DASH.line)return;
  const L=DASH.line;
  const pick=e=>{
    const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*L.W;
    let best=0,bd=1e9;
    L.xs.forEach((px,i)=>{const d=Math.abs(px-x);if(d<bd){bd=d;best=i;}});
    lcSelect(best);
  };
  svg.addEventListener('pointerdown',pick);
  svg.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)pick(e);});
}

/* ---------- widget: doughnut ---------- */
function donutRows(){
  const rows=DASH.rows;
  if(rows.length<=8)return rows.map(r=>({...r}));
  const top=rows.slice(0,7).map(r=>({...r})),rest=rows.slice(7).reduce((s,r)=>s+r.v,0);
  return [...top,{id:'_o',name:'Others',color:'#6B7280',v:rest}];
}
function wDonut(){
  const rows=donutRows(),tot=rows.reduce((s,r)=>s+r.v,0);
  const head=`<div class="wh"><h2>Where the money went</h2></div>`;
  if(!rows.length)return `<section class="w w-donut">${head}<div class="muted">No spending in this period.</div></section>`;
  let a=-Math.PI/2;
  rows.forEach(r=>{r.a0=a;a+=r.v/tot*Math.PI*2;r.a1=a;});
  DASH.dn={rows,tot,sel:null,r:rows.map(()=>100),els:[]};
  const paths=rows.map((r,i)=>`<path class="sl" data-i="${i}" fill="${r.color}" fill-rule="evenodd"/>`).join('');
  const legend=rows.map((r,i)=>`<button class="lg" data-i="${i}"><i class="dot" style="background:${r.color}"></i>${esc(r.name)}</button>`).join('');
  return `<section class="w w-donut">${head}<div class="dn"><svg id="dnSvg" viewBox="0 0 240 240" role="img" aria-label="Spending by tag">${paths}
    <text class="ct" id="dnName" x="120" y="108" style="fill:var(--muted);font-size:12px;font-weight:600">Total</text>
    <text class="ct" id="dnVal" x="120" y="132" style="fill:var(--ink);font-size:22px;font-weight:700">${nf0.format(tot)}</text>
    <text class="ct" id="dnPct" x="120" y="150" style="fill:var(--muted);font-size:11px">${base()}</text></svg>
    <div class="dn-card" id="dnCard"></div><div class="dn-legend" id="dnLegend">${legend}</div></div></section>`;
}
function drawDonut(p){
  const D=DASH&&DASH.dn;if(!D)return;
  const lim=-Math.PI/2+p*Math.PI*2;
  D.rows.forEach((r,i)=>{const el=D.els[i];if(el)el.setAttribute('d',arcPath(120,120,64,D.r[i],r.a0,Math.min(r.a1,lim)));});
}
function initDonut(animate){
  const D=DASH&&DASH.dn,svg=$('#dnSvg');
  if(!D||!svg)return;
  D.els=$$('#dnSvg .sl');D.r=D.rows.map(()=>100);D.sel=null;
  D.els.forEach((el,i)=>el.addEventListener('click',e=>{e.stopPropagation();dnSelect(i);}));
  svg.addEventListener('click',()=>{if(D.sel!==null)dnSelect(D.sel);});
  $$('#dnLegend .lg').forEach(b=>b.addEventListener('click',()=>dnSelect(+b.dataset.i)));
  tween(animate?900:0,p=>drawDonut(p));
}
function dnSelect(i){
  const D=DASH.dn;
  if(D.sel===i)i=null;
  D.sel=i;
  const from=D.r.slice(),to=D.rows.map((_,j)=>j===i?109:100);
  tween(200,t=>{D.r=from.map((f,j)=>f+(to[j]-f)*t);drawDonut(1);});
  D.els.forEach((el,j)=>{el.style.opacity=(i===null||j===i)?'1':'.38';});
  $$('#dnLegend .lg').forEach((b,j)=>b.classList.toggle('on',j===i));
  const name=$('#dnName'),val=$('#dnVal'),pct=$('#dnPct'),card=$('#dnCard');
  if(i===null){
    name.textContent='Total';name.style.fill='var(--muted)';val.textContent=nf0.format(D.tot);pct.textContent=base();
    card.classList.remove('on');return;
  }
  const r=D.rows[i],p=(r.v/D.tot*100).toFixed(1);
  name.textContent=r.name;name.style.fill=r.color;val.textContent=nf0.format(r.v);pct.textContent=p+'%';
  card.innerHTML=`<div class="dn-r1"><i class="dot" style="background:${r.color}"></i><span class="nm" dir="auto">${esc(r.name)}</span><b class="amt">${nf.format(r.v)}</b><span class="cur">${base()}</span></div><div class="dn-r2"><span>${p}% of spending</span>${r.id==='_o'?'':`<button class="btn sm" data-act="dnDrill" data-i="${i}">See merchants</button>`}</div>`;
  card.classList.add('on');
}
function dnDrill(i){
  const r=DASH.dn.rows[i];
  if(!r||r.id==='_o')return;
  ui.topTab='cat';ui.topDrill=r.id;refreshTop(true);
  const box=$('#topBox');if(box)box.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'center'});
}

/* ---------- widget: top merchants, categories, items ---------- */
function topData(){
  const ex=DASH.ex,byDesc=(a,b)=>b.v-a.v;
  if(ui.topDrill){
    const id=ui.topDrill,m=new Map();
    ex.forEach(t=>allocations(t).forEach(a=>{if(a.tagId!==id)return;const k=t.title.trim(),o=m.get(k.toLowerCase())||{name:k,v:0};o.v+=inBase(t,a.amount);m.set(k.toLowerCase(),o);}));
    return [...m.values()].sort(byDesc).slice(0,10).map(o=>({...o,kind:'merchant',color:tagOf(id).color}));
  }
  if(ui.topTab==='cat')return DASH.rows.slice(0,10).map(r=>({name:r.name,v:r.v,id:r.id,kind:'cat',color:r.color}));
  const m=new Map();
  if(ui.topTab==='item'){
    ex.forEach(t=>allocations(t).forEach(a=>{if(a.rest)return;const k=a.name.trim().toLowerCase(),o=m.get(k)||{name:a.name.trim(),v:0,c:0,tagId:a.tagId};o.v+=inBase(t,a.amount);o.c++;m.set(k,o);}));
    return [...m.values()].sort(byDesc).slice(0,10).map(o=>({...o,kind:'item',color:tagOf(o.tagId).color}));
  }
  ex.forEach(t=>{const k=t.title.trim().toLowerCase(),o=m.get(k)||{name:t.title.trim(),v:0,c:0,tagId:t.tagId};o.v+=inBase(t,t.total);o.c++;m.set(k,o);});
  return [...m.values()].sort(byDesc).slice(0,10).map(o=>({...o,kind:'merchant',color:tagOf(o.tagId).color}));
}
function topInner(){
  const rows=topData();DASH.topRows=rows;
  let h='';
  if(ui.topDrill)h+=`<div class="backrow"><button class="btn sm" data-act="topBack">‹ Back</button><b>Merchants in ${esc(tagOf(ui.topDrill).name)}</b></div>`;
  else h+=`<div class="seg tabs2" role="group" aria-label="Group by">${[['merchant','Merchants'],['cat','Categories'],['item','Items']].map(([k,l])=>`<button data-act="topTab" data-v="${k}" class="${ui.topTab===k?'on':''}">${l}</button>`).join('')}</div>`;
  if(!rows.length)return h+`<div class="muted">Nothing to show for this period.</div>`;
  const mx=rows[0].v||1;
  return h+`<div class="rank">${rows.map((r,i)=>`<button class="r" data-act="topRow" data-i="${i}"><div class="top"><i class="dot" style="background:${r.color}"></i><span class="nm" dir="auto">${esc(r.name)}${r.c>1?` <span class="muted">×${r.c}</span>`:''}</span><span class="amt">${nf.format(r.v)}</span><span class="cur">${base()}</span></div><div class="bar"><i style="width:${r.v/mx*100}%;background:${r.color}"></i></div></button>`).join('')}</div>`;
}
function wTop(){
  return `<section class="w w-top"><div class="wh"><h2>Top spending</h2></div><div id="topBox">${topInner()}</div></section>`;
}
function refreshTop(animate){
  const box=$('#topBox');if(!box)return;
  box.innerHTML=topInner();
  if(animate){box.classList.remove('enter');void box.offsetWidth;box.classList.add('enter');clearTimeout(refreshTop.t);refreshTop.t=setTimeout(()=>box.classList.remove('enter'),1200);}
}
function topRow(i){
  const r=DASH.topRows&&DASH.topRows[i];if(!r)return;
  if(r.kind==='cat'){ui.topDrill=r.id;refreshTop(true);return;}
  goLedger({range:{from:DASH.R.from,to:DASH.R.to,label:DASH.R.label==='Custom'?fmtD(DASH.R.from)+' to '+fmtD(DASH.R.to):DASH.R.label},q:r.name,tag:ui.topDrill||''});
}

function updateSum(){
