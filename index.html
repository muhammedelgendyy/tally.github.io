function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load the reader. Check your internet connection and try again.'));document.head.appendChild(s);});}
async function loadBitmap(file){
  try{return await createImageBitmap(file,{imageOrientation:'from-image'});}
  catch{return await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('Could not open that photo.'));im.src=URL.createObjectURL(file);});}
}
async function fileToJpegB64(file,max){
  const bmp=await loadBitmap(file),w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight,sc=Math.min(1,max/Math.max(w0,h0));
  const c=document.createElement('canvas');c.width=Math.round(w0*sc);c.height=Math.round(h0*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.85).split(',')[1];
}
async function preprocess(file){
  const bmp=await loadBitmap(file),w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight,sc=Math.min(1,2200/Math.max(w0,h0));
  const c=document.createElement('canvas');c.width=Math.round(w0*sc);c.height=Math.round(h0*sc);
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){let g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];g=(g-128)*1.35+138;g=g<0?0:g>255?255:g;p[i]=p[i+1]=p[i+2]=g;}
  x.putImageData(d,0,0);
  return c;
}

/* --- Gemini --- */
const GEM_MODELS=['gemini-3.8-flash','gemini-3.5-flash','gemini-2.5-flash','gemini-3.5-flash-lite'];
const gem=()=>state.settings.gemini||(state.settings.gemini={keys:[],model:'',last:null});
const gemKeys=()=>state?gem().keys.filter(Boolean):[];
const maskKey=k=>'…'+k.slice(-4);
const gemModels=()=>[...new Set([gem().model.trim(),...GEM_MODELS].filter(Boolean))];
const GEM_WHY={badkey:'key rejected',denied:'access denied',quota:'quota used up',nomodel:'model unavailable',server:'Google error',other:'request failed'};
async function gemFetch(k,model,body){
  const u=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  try{return await fetch(u,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body});}
  catch{return await fetch(u+'?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body});}
}
async function gemCall(k,model,parts,json){
  let r;
  try{
    r=await gemFetch(k,model,JSON.stringify({contents:[{parts}],generationConfig:json?{responseMimeType:'application/json',temperature:0}:{temperature:0}}));
  }catch{return {ok:false,kind:'network'};}
  let j=null;try{j=await r.json();}catch{}
  if(r.ok){
    const ps=(j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
    return {ok:true,text:ps.map(p=>p.text||'').join('')};
  }
  const raw=JSON.stringify(j||{}),st=j&&j.error&&j.error.status;
  let kind='other';
  if(/API_KEY_INVALID|api key not valid|api key expired|api key not found/i.test(raw))kind='badkey';
  else if(r.status===429||st==='RESOURCE_EXHAUSTED')kind='quota';
  else if(r.status===403||st==='PERMISSION_DENIED')kind='denied';
  else if(r.status===404||st==='NOT_FOUND')kind='nomodel';
  else if(r.status>=500)kind='server';
  return {ok:false,kind,status:r.status,msg:String((j&&j.error&&j.error.message)||'').replace(/\s+/g,' ').slice(0,100)};
}
function extractJSON(t){
  const s=String(t||'').replace(/```(?:json)?/gi,'');
  const a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a<0||b<a)return null;
  try{return JSON.parse(s.slice(a,b+1));}catch{return null;}
}
function receiptPrompt(tagNames){
  return `You read shopping receipts. The photo may be in English, Arabic, or both.
Return ONLY JSON in this shape:
{"merchant":string,"date":"YYYY-MM-DD" or "","currency":"AED" or "EGP" or "USD" or "","total":number,"items":[{"name":string,"amount":number,"tag":string}]}
Rules:
- merchant: the store name as printed.
- date: the purchase date. Receipts here are usually day/month/year. Use "" if it is not visible.
- currency: only if printed or obvious, otherwise "".
- total: the final amount paid including VAT, not the subtotal.
- items: one entry per purchased product. name = the product name in the language printed (fix obvious misprints). amount = the line total for that product (quantity x unit price) as printed, after any line discount. Never include subtotal, VAT or tax, rounding, payment, change, card or loyalty lines.
- Use Western digits and a dot as the decimal separator.
- tag: the best match from this list, written exactly as here: ${JSON.stringify(tagNames)}
- Do not invent items. Leave out anything unreadable.`;
}
function normalizeGemini(d){
  const num=v=>{const n=typeof v==='number'?v:parseAmt(v);return isFinite(n)?n:NaN;};
  const items=(Array.isArray(d.items)?d.items:[]).map(i=>({name:String((i&&i.name)||'').trim().slice(0,80),amount:num(i&&(i.amount??i.total)),tagName:String((i&&i.tag)||'')})).filter(i=>i.name&&i.amount>0);
  const t=num(d.total),cur=String(d.currency||'').toUpperCase(),dt=String(d.date||'');
  return {
    title:String(d.merchant||'').trim().slice(0,60),
    date:/^\d{4}-\d{2}-\d{2}$/.test(dt)&&+dt.slice(0,4)>=2000&&+dt.slice(0,4)<=2100?dt:'',
    currency:CURS.includes(cur)?cur:'',
    total:t>0?t:(items.length?round2(items.reduce((s,i)=>s+i.amount,0)):null),
    items
  };
}
async function geminiScan(file){
  const all=gemKeys(),last=gem().last;
  const order=[...all.filter(k=>last&&k===last.k),...all.filter(k=>!(last&&k===last.k))];
  const b64=await fileToJpegB64(file,1600);
  const names=state.tags.filter(t=>t.kind==='expense').map(t=>t.name);
  const parts=[{text:receiptPrompt(names)},{inlineData:{mimeType:'image/jpeg',data:b64}}];
  const problems=[];
  for(let ki=0;ki<order.length;ki++){
    const k=order[ki],base_=gemModels();
    const ms=(last&&k===last.k&&base_.includes(last.m))?[last.m,...base_.filter(m=>m!==last.m)]:base_;
    for(const m of ms){
      showBusy(`Reading receipt with Gemini… (key ${ki+1} of ${order.length})`);
      const r=await gemCall(k,m,parts,true);
      if(r.ok){
        const data=extractJSON(r.text);
        if(data){gem().last={k,m};save();return normalizeGemini(data);}
        problems.push(`${maskKey(k)} ${m}: Gemini answered but the reply could not be read`);continue;
      }
      if(r.kind==='network')throw new Error('Could not reach Gemini. Either there is no internet connection or the request was blocked.');
      problems.push(`${maskKey(k)} ${m}: ${GEM_WHY[r.kind]} (HTTP ${r.status}${r.msg?', '+r.msg:''})`);
      if(r.kind==='badkey'||r.kind==='denied')break;
    }
  }
  throw new Error(`Gemini could not read this receipt. None of your ${order.length} key${order.length===1?'':'s'} worked:\n`+problems.slice(-6).map(x=>'• '+x).join('\n'));
}
async function testKeys(){
  const keys=gemKeys(),out=$('#gemOut');
  if(!keys.length){toast('Paste at least one API key first');return;}
  out.innerHTML=keys.map((k,i)=>`<div class="kres"><span>${maskKey(k)}</span><em class="wait" id="kr${i}">waiting</em></div>`).join('');
  let firstOk=null;
  for(let i=0;i<keys.length;i++){
    const el=$('#kr'+i);el.textContent='testing…';
    let done=false,why='';
    for(const m of gemModels()){
      const r=await gemCall(keys[i],m,[{text:'Reply with the single word OK.'}],false);
      if(r.ok){el.className='ok';el.textContent='Works with '+m;done=true;if(!firstOk)firstOk={k:keys[i],m};break;}
      if(r.kind==='network'){el.className='no';el.textContent='No connection';return;}
      why=GEM_WHY[r.kind]+(r.status?` (${r.status})`:'');
      if(r.kind==='badkey'||r.kind==='denied')break;
    }
    if(!done){el.className='no';el.textContent=why||'Failed';}
  }
  if(firstOk){gem().last=firstOk;await save();toast('Ready: '+maskKey(firstOk.k)+' will be used first');}
  else toast('None of the keys worked');
}

/* --- on-device fallback --- */
async function tesseractScan(file){
  const lang=localStorage.getItem('tally.ocr')||'eng+ara';
  showBusy('Preparing photo…');
  const canvas=await preprocess(file);
  showBusy('Loading the reader…');
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  const worker=await Tesseract.createWorker(lang,1,{logger:m=>{
    if(m.status==='recognizing text')showBusy('Reading receipt… '+Math.round(m.progress*100)+'%');
    else if(/loading/.test(m.status))showBusy('Loading language data (first time only)…');
  }});
  const {data}=await worker.recognize(canvas);
  await worker.terminate();
  return parseReceipt(data.text);
}
function applyScan(r,note){
  if(!form)return;
  if(!form.title&&r.title)form.title=r.title;
  if(!form.tagTouched){const s=suggestTag(form.title,'expense');if(s)form.tagId=s;}
  if(r.date)form.date=r.date;
  if(r.currency)form.currency=r.currency;
  if(r.total!=null&&!form.total)form.total=Number(r.total).toFixed(2);
  const byName=new Map(state.tags.filter(t=>t.kind==='expense').map(t=>[t.name.toLowerCase(),t.id]));
  const fresh=r.items.map(i=>({id:uid(),name:i.name,amount:Number(i.amount).toFixed(2),tagId:learnedTag(i.name)||byName.get(String(i.tagName||'').toLowerCase())||form.tagId,_new:true}));
  form.items=form.items.filter(i=>i.name||i.amount).concat(fresh);
  renderForm();
  toast((note?note+' ':'')+(fresh.length?`Found ${fresh.length} item${fresh.length>1?'s':''}. Check them before saving.`:'No items found. Add them by hand.'));
}
async function handleScan(file){
  let r=null,via='';
  try{
    if(gemKeys().length){
      try{showBusy('Preparing photo…');r=await geminiScan(file);via='Read with Gemini ('+gem().last.m+').';}
      catch(e){
        hideBusy();
        if(!confirm(e.message+'\n\nUse the free on-device reader instead?'))return;
      }
    }
    if(!r){r=await tesseractScan(file);via='Read with the on-device reader.';}
    applyScan(r,via);
  }catch(e){toast(e.message||'Could not read that receipt.');}
  finally{hideBusy();}
}


function smsRead(){
  const ta=$('#smsText');if(ta)form.smsText=ta.value;
  const r=parseBankSMS(form.smsText);
  if(!r){toast('Paste the message text first');return;}
  if(r.rejected){toast('That message looks like a declined transaction. Nothing was added.');return;}
  if(!(r.amount>0)){toast('Could not find an amount in that message');return;}
  if(r.type!==form.type){form.type=r.type;form.items=[];}
  form.total=r.amount.toFixed(2);
  if(r.title&&r.title!=='Unknown')form.title=r.title;
  if(r.date)form.date=r.date;
  if(r.currency)form.currency=r.currency;
  form.tagId=r.tagId;form.tagTouched=false;form.raw=r.raw;form.smsOpen=false;
  renderForm();toast('Filled in from the message. Check it before saving.');
}
async function smsPaste(){
  try{
    const t=await navigator.clipboard.readText();
    if(!t){toast('The clipboard is empty');return;}
    form.smsText=t;const ta=$('#smsText');if(ta)ta.value=t;smsRead();
  }catch{toast('Could not read the clipboard. Long-press the box and choose Paste.');}
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('click',async e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){if(tab.dataset.tab==='ledger'&&ui.tab!=='ledger'){ui.lRange=null;ui.q='';ui.tag='';}ui.tab=tab.dataset.tab;render(true);$('main').scrollTop=0;return;}
  const a=e.target.closest('[data-act]');if(!a)return;
  const d=a.dataset;
  switch(d.act){
    case 'new':openForm(null);break;
    case 'edit':openForm(d.id);break;
    case 'closeSheet':closeSheet();break;
    case 'prevM':ui.month=shiftMonth(ui.month,-1);render(true);break;
    case 'nextM':ui.month=shiftMonth(ui.month,1);render(true);break;
    case 'setView':ui.view=d.v;render(true);break;
    case 'setPeriod':ui.period=d.v;if(d.v==='custom'&&!ui.dFrom){ui.dFrom=ui.dMonth+'-01';ui.dTo=todayStr();}render(true);break;
    case 'dPrev':if(ui.period==='month')ui.dMonth=shiftMonth(ui.dMonth,-1);else ui.dYear--;render(true);break;
    case 'dNext':if(ui.period==='month')ui.dMonth=shiftMonth(ui.dMonth,1);else ui.dYear++;render(true);break;
    case 'pop':popToggle(a);break;
    case 'lineMode':ui.lineMode=d.v;render(true);break;
    case 'lcView':{const b=DASH&&DASH.B.list[DASH.sel];if(b)goLedger({range:bRange(b,DASH.B.daily)});break;}
    case 'dcard':{const b=DASH.B.list.find(x=>x.key===d.key);if(b)goLedger({range:bRange(b,DASH.B.daily)});break;}
    case 'topTab':ui.topTab=d.v;ui.topDrill=null;refreshTop(true);break;
    case 'topBack':ui.topDrill=null;refreshTop(true);break;
    case 'topRow':topRow(+d.i);break;
    case 'dnDrill':dnDrill(+d.i);break;
    case 'widgets':widgetsSheet();break;
    case 'wToggle':case 'wUp':case 'wDown':widgetAction(d.act,d.id);break;
    case 'clearRange':ui.lRange=null;ui.q='';ui.tag='';render(true);break;
    case 'smsToggle':form.smsOpen=!form.smsOpen;renderForm();break;
    case 'smsRead':smsRead();break;
    case 'smsPaste':smsPaste();break;
    case 'rulesReset':if(confirm('Forget all learned merchants?')){state.rules={};save();render();toast('Forgot learned merchants');}break;
    case 'setType':if(form.type!==d.v){form.type=d.v;form.tagId=d.v==='expense'?'other':'salary';if(d.v==='income')form.items=[];renderForm();}break;
    case 'addItem':form.items.push({id:uid(),name:'',amount:'',tagId:form.type==='expense'?form.tagId:'other',_new:true});renderForm();break;
    case 'rmItem':form.items.splice(+d.i,1);renderForm();break;
    case 'saveForm':saveForm();break;
    case 'delTx':delTx();break;
    case 'setTheme':localStorage.setItem('tally.theme',d.v);applyTheme();render();break;
    case 'refreshRates':{showBusy('Fetching live rates…');const ok=await refreshRates(true);hideBusy();toast(ok?'Rates updated':'Could not reach the rate service');render();break;}
    case 'liveRate':delete state.settings.manual[d.c];await save();await refreshRates(true);render();break;
    case 'newTag':tagSheet(null);break;
    case 'editTag':tagSheet(d.id);break;
    case 'tagKind':window.tagForm.kind=d.v;$$('[data-act=tagKind]').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v));break;
    case 'tagColor':window.tagForm.color=d.v;$$('[data-act=tagColor]').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v));break;
    case 'saveTag':saveTag();break;
    case 'delTag':delTag();break;
    case 'toggleKeys':{const k=$('#gemKeys');k.classList.toggle('show');a.textContent=k.classList.contains('show')?'Hide':'Show';break;}
    case 'testKeys':testKeys();break;
    case 'exportBackup':exportBackup();break;
    case 'exportCSV':exportCSV();break;
    case 'importSheet':openSheet(`<div class="sheet"><div class="sh-head"><button class="cancel" data-act="closeSheet">Cancel</button><b>Import backup</b><button class="save" data-act="doImport">Import</button></div><div class="sh-body"><p class="muted">This replaces everything on this device with the contents of the backup.</p>${importFormHTML()}<div class="err" id="impErr"></div></div></div>`);break;
    case 'doImport':doImport();break;
    case 'authImport':showAuth('import');break;
    case 'authBack':showAuth('login');break;
    case 'doSetup':doSetup();break;
    case 'doLogin':doLogin();break;
    case 'logout':logout();break;
    case 'erase':
      if(confirm('Erase everything stored on this device? Export a backup first if you want to keep it.')&&confirm('This cannot be undone. Erase now?')){
        try{await kvDel('session');}catch{}
        localStorage.removeItem(VAULT);localStorage.removeItem('tally.fails');localStorage.removeItem('tally.lock');
        location.reload();
      }break;
  }
});
function onField(e){
  const el=e.target;
  if(el.matches('[data-scan]')){const f=el.files[0];el.value='';if(f)handleScan(f);return;}
  if(el.matches('[data-ocr]')){localStorage.setItem('tally.ocr',el.value);return;}
  if(el.dataset.filter){ui[el.dataset.filter]=el.value;$('#view').classList.remove('enter');const b=$('#ledgerBody');if(b)b.innerHTML=ledgerBody();return;}
  if(el.dataset.dcustom){ui[el.dataset.dcustom]=el.value;if(e.type==='change')render(true);return;}
  if(el.dataset.cv){ui[el.dataset.cv==='amt'?'cvAmt':'cvFrom']=el.value;$('#cvOut').innerHTML=convertOut();return;}
  if(el.dataset.rate&&e.type==='change'){const v=parseAmt(el.value);if(v>0){state.settings.rates[el.dataset.rate]=v;state.settings.manual[el.dataset.rate]=true;save();render();}return;}
  if(el.dataset.gem&&e.type==='change'){
    if(el.dataset.gem==='keys'){gem().keys=[...new Set(el.value.split(/[\s,;]+/).map(s=>s.trim()).filter(s=>s.length>=20))].slice(0,8);gem().last=null;const n=gem().keys.length;const c=$('#gemCount');if(c)c.textContent=n+' key'+(n===1?'':'s')+' saved';toast(n?n+' key'+(n===1?'':'s')+' saved':'No keys saved');}
    else gem().model=el.value.trim();
    save();return;
  }
  if(el.dataset.set==='base'&&e.type==='change'){state.settings.base=el.value;save();render();return;}
  const b=el.dataset.bind;
  if(b&&form){
    if(el.dataset.i!==undefined)form.items[+el.dataset.i][b]=el.value;else form[b]=el.value;
    if(b==='tagId'&&el.dataset.i===undefined)form.tagTouched=true;
    if(b==='title'&&e.type==='change'&&!form.tagTouched){const s=suggestTag(form.title,form.type);if(s){form.tagId=s;const sel=$('#f_tag');if(sel)sel.value=s;}}
    if(b==='amount'||b==='total'||b==='currency')updateSum();
  }
}
$('#popBackdrop').addEventListener('click',unpop);
document.addEventListener('input',onField);
document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&$('#auth')&&!$('#auth').hidden&&e.target.tagName==='INPUT'){const b=$('#auth .btn.pri');if(b)b.click();}
  if(e.key==='Escape'&&$('#sheetHost.open')&&!form)closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('receipt')){e.preventDefault();openForm(e.target.dataset.id);}
});

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot(){
  applyTheme();
  if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window._rl){window._rl=1;location.reload();}});navigator.serviceWorker.register('sw.js').catch(()=>{});}
  if(!crypto||!crypto.subtle){document.body.innerHTML='<p style="padding:24px">This app needs a secure (https) connection.</p>';return;}
  const v=loadVault();
  if(!v){showAuth('setup');hideSplash();return;}
  vaultMeta=v;
  try{
    const k=await kvGet('session');
    if(k){state=await decryptJSON(k,v);key=k;startApp();return;}
  }catch{}
  showAuth('login');hideSplash();
})();
</script>
